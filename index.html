<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#a5151b">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src https://fahrblkukuhgveiptufn.supabase.co; form-action 'none'; base-uri 'none'">
  <title>登入｜富聯核心團隊</title>
  <link rel="icon" href="assets/images/fulian-favicon.png">
  <link rel="stylesheet" href="login.css?v=b92ced8f8048">
  <link rel="stylesheet" href="release-preview.css?v=39c7cad80e09">
  <link rel="stylesheet" href="member-data.css?v=7266a0e99a34">
  <script src="chair-auth.js?v=abb801f273bf" defer></script><script src="production-login.js?v=5a94853dff09" defer></script>
</head>
<body>
  <main class="login-shell">
    <section class="brand-panel" aria-label="富聯分會">
      <div class="brand-top"><img src="assets/images/fulian-favicon.png" alt="富聯分會標誌"><span class="brand-name"><b>富聯核心團隊</b><small>FULIAN CHAPTER</small></span></div>
      <div class="brand-story">
        <span class="eyebrow">CHAPTER LEADERSHIP</span>
        <h1>讓每一份承諾<br>成為共同的成果</h1>
        <p class="brand-description">回到基本功，以股東的心態共同經營分會；讓每位會員的承諾都有執行與追蹤，將夥伴情誼化為實際的商務合作。</p>
        <div class="brand-tags" aria-label="本屆三大主軸"><span>全員當責</span><span>股東思維</span><span>產業鏈實踐</span></div>
      </div>
      <div class="brand-foot"><span>核心團隊 × 產業領頭羊</span><b>讓每一次決議，都有值得信任的依據</b></div>
    </section>
    <div class="access-panel">
      <section class="login-card" aria-labelledby="panelTitle">
        <span class="preview-label">會員資料已連線</span>
        <p class="release-preview-note">使用主席或核心帳號登入查看會員資料。會議與工作目前仍只保存在此瀏覽器。</p>
        <h2 id="panelTitle" tabindex="-1">登入工作台</h2>
        <p class="intro" id="panelIntro">使用目前職務的共用帳號。</p>
        <form id="loginForm">
          <label>帳號<input id="username" autocomplete="username" required placeholder="主席 chair／核心 core"></label>
          <label>密碼<input id="password" type="password" autocomplete="current-password" required placeholder="請輸入密碼"></label>
          <button class="primary" id="loginButton">登入系統</button>
        </form>
        <form id="identityForm" hidden>
          <label><span id="identityLabel">選擇職務</span><select id="identity" required></select></label>
          <p class="empty-note" id="rosterNote" hidden>領頭羊名單尚未設定。</p>
          <button class="primary" id="identityButton">進入工作台</button>
          <button class="secondary" type="button" data-back>返回登入</button>
        </form>
        <p id="loginError" role="alert"></p>
        <noscript><p>請開啟 JavaScript 以登入。</p></noscript>
      </section>
    </div>
  </main>
</body>
</html>
